name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle -not -path '*/.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle was not found. Files in repo:"
            find . -not -path './.git/*' -type f | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project directory: $(dirname "$f")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show error on summary page
        if: failure()
        run: |
          echo '### Output (last 80 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no build log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-client
          path: ${{ steps.loc.outputs.dir }}/versions/*/build/libs/pulse-client-*.jar
