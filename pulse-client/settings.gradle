pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.3'
}

stonecutter {
    create(rootProject) {
        // Add a version here AND create versions/<mc>/gradle.properties for it.
        versions '1.21.9', '1.21.10', '1.21.11'
        vcsVersion = '1.21.11'
    }
}

rootProject.name = 'pulse-client'
